namespace: webgrip.nl

_shared_config:
  hostname: &hostname webgrip.nl
  url: &url https://webgrip.nl

wordpress:
  image:
    registry:   ghcr.io
    repository: webgrip-nl-wordpress
    tag:        latest
    pullPolicy: Always

  ingress:
    enabled:   true
    className: ingress-traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-traefik
    hostname: *hostname
    tls: true
    tlsWwwPrefix: true
    extraTls:
      - hosts: [webgrip.nl, www.webgrip.nl]
        secretName: letsencrypt-webgrip-nl-wordpress

  persistence:
    enabled: true
    storageClass: do-block-storage
    accessModes: ["ReadWriteOnce"]
    size: 15Gi

  replicaCount: 1

  wordpressScheme: https
  wordpressUsername: ${WORDPRESS_USERNAME:-admin}
  existingSecret: wp-site-admin # Secret must contain key  ➜ wordpress-password

  resources:
    requests:
      cpu:    100m
      memory: 256Mi
    limits:
      cpu:    500m
      memory: 512Mi

  mariadb:
    enabled: true
    auth:
      existingSecret: wp-db-auth
      # Secret must contain keys:
      #   - mariadb-root-password
      #   - mariadb-password
      #   - mariadb-user
      #   - mariadb-database
    primary:
      persistence:
        enabled: true
        storageClass: do-block-storage
        accessModes: ["ReadWriteOnce"]
        size: 15Gi

  allowEmptyPassword: false
